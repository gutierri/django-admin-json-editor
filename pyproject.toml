[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-admin-json-editor"
version = "0.2.3-dev"
description = "A simple Django app to add JSON widget into Django Administration."
readme = "README.md"
authors = [
    { name = "Alexander Bogushov", email = "abogushov@gmail.com" }
]
license = { text = "MIT License" }
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django",
]
# A propriedade 'dynamic' foi removida daqui

[project.urls]
Homepage = "https://github.com/abogushov/django-admin-json-editor"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-django",
]

[tool.setuptools]
packages = ["django_admin_json_editor"]
include-package-data = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
addopts = "--doctest-modules --nomigrations"
testpaths = [
    "django_admin_json_editor",
    "tests"
]
flake8-max-complexity = 10
flake8-max-line-length = 99

[tool.isort]
force_single_line = false
import_heading_localfolder = "true"